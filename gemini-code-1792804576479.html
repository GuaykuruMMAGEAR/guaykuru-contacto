<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guaykurú MMA Gear | Contacto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: #1a1a1a;
            padding: 30px 20px;
            border-radius: 15px;
            border: 2px solid #d4af37; /* Detalle dorado */
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #d4af37;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .btn-whatsapp {
            background-color: #25D366;
            color: #ffffff;
        }
        .btn-instagram {
            background: linear-divider;
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
            color: #ffffff;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">GUAYKURÚ MMA GEAR</div>
        <div class="subtitle">Equipamiento y Indumentaria de Combate</div>

        <!-- Botón de WhatsApp con mensaje precargado -->
        <a href="https://wa.me/595981989202?text=Hola,%20quiero%20consultar%20sobre%20los%20productos%20de%20Guaykurú" target="_blank" class="btn btn-whatsapp">
            Escribinos al WhatsApp
        </a>

        <!-- Botón de Instagram -->
        <a href="https://instagram.com/GuaykuruMMAGEAR" target="_blank" class="btn btn-instagram">
            Seguinos en Instagram
        </a>

        <div class="footer">PARAGUAY</div>
    </div>

</body>
</html>
